<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 600" fill="none">
  <defs>
    <linearGradient id="bpBg" x1="0" y1="0" x2="1920" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#071428"/>
      <stop offset="0.5" stop-color="#0c1f3f"/>
      <stop offset="1" stop-color="#0f2847"/>
    </linearGradient>
    <radialGradient id="bpGl" cx="1200" cy="300" r="700" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1d4ed8" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#1d4ed8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1920" height="600" fill="url(#bpBg)"/>
  <rect width="1920" height="600" fill="url(#bpGl)"/>

  <!-- Blueprint grid (fine) -->
  <g stroke="#1e3a5f" stroke-width="0.3" opacity="0.4">
    <line x1="0" y1="60" x2="1920" y2="60"/><line x1="0" y1="120" x2="1920" y2="120"/><line x1="0" y1="180" x2="1920" y2="180"/><line x1="0" y1="240" x2="1920" y2="240"/><line x1="0" y1="300" x2="1920" y2="300"/><line x1="0" y1="360" x2="1920" y2="360"/><line x1="0" y1="420" x2="1920" y2="420"/><line x1="0" y1="480" x2="1920" y2="480"/><line x1="0" y1="540" x2="1920" y2="540"/>
    <line x1="60" y1="0" x2="60" y2="600"/><line x1="120" y1="0" x2="120" y2="600"/><line x1="180" y1="0" x2="180" y2="600"/><line x1="240" y1="0" x2="240" y2="600"/><line x1="300" y1="0" x2="300" y2="600"/><line x1="360" y1="0" x2="360" y2="600"/><line x1="420" y1="0" x2="420" y2="600"/><line x1="480" y1="0" x2="480" y2="600"/><line x1="540" y1="0" x2="540" y2="600"/><line x1="600" y1="0" x2="600" y2="600"/><line x1="660" y1="0" x2="660" y2="600"/><line x1="720" y1="0" x2="720" y2="600"/><line x1="780" y1="0" x2="780" y2="600"/><line x1="840" y1="0" x2="840" y2="600"/><line x1="900" y1="0" x2="900" y2="600"/><line x1="960" y1="0" x2="960" y2="600"/><line x1="1020" y1="0" x2="1020" y2="600"/><line x1="1080" y1="0" x2="1080" y2="600"/><line x1="1140" y1="0" x2="1140" y2="600"/><line x1="1200" y1="0" x2="1200" y2="600"/><line x1="1260" y1="0" x2="1260" y2="600"/><line x1="1320" y1="0" x2="1320" y2="600"/><line x1="1380" y1="0" x2="1380" y2="600"/><line x1="1440" y1="0" x2="1440" y2="600"/><line x1="1500" y1="0" x2="1500" y2="600"/><line x1="1560" y1="0" x2="1560" y2="600"/><line x1="1620" y1="0" x2="1620" y2="600"/><line x1="1680" y1="0" x2="1680" y2="600"/><line x1="1740" y1="0" x2="1740" y2="600"/><line x1="1800" y1="0" x2="1800" y2="600"/><line x1="1860" y1="0" x2="1860" y2="600"/>
  </g>

  <!-- Left fade for text readability -->
  <rect x="0" y="0" width="680" height="600" fill="url(#bpBg)" opacity="0.88"/>

  <!-- ============ FLOOR PLAN ============ -->
  <g transform="translate(720, 50)">
    <!-- Main building outline -->
    <rect x="0" y="0" width="1080" height="480" stroke="#60a5fa" stroke-width="2.5" fill="none" opacity="0.5"/>

    <!-- Interior walls -->
    <g stroke="#60a5fa" stroke-width="1.8" opacity="0.35">
      <!-- Horizontal -->
      <line x1="0" y1="200" x2="500" y2="200"/>
      <line x1="580" y1="200" x2="1080" y2="200"/>
      <line x1="0" y1="340" x2="380" y2="340"/>
      <line x1="460" y1="340" x2="700" y2="340"/>
      <line x1="700" y1="200" x2="700" y2="480"/>
      <!-- Vertical -->
      <line x1="400" y1="0" x2="400" y2="200"/>
      <line x1="700" y1="0" x2="700" y2="200"/>
      <line x1="400" y1="340" x2="400" y2="480"/>
    </g>

    <!-- Door arcs (quarter circles) -->
    <g stroke="#60a5fa" stroke-width="1" fill="none" opacity="0.3">
      <!-- Door in horizontal wall at y=200, x=500-580 (opening) -->
      <path d="M 500 200 A 40 40 0 0 1 540 160"/>
      <!-- Door at y=340, x=380-460 -->
      <path d="M 380 340 A 40 40 0 0 0 420 380"/>
      <!-- Door in vertical wall x=400, y=0-200 area -->
      <path d="M 400 100 A 40 40 0 0 1 440 140"/>
      <!-- Door at x=700 -->
      <path d="M 700 280 A 40 40 0 0 0 740 320"/>
    </g>

    <!-- Window symbols on exterior walls (double lines with break) -->
    <g stroke="#93c5fd" stroke-width="1.2" opacity="0.3">
      <!-- Top wall windows -->
      <line x1="120" y1="-6" x2="280" y2="-6"/><line x1="120" y1="6" x2="280" y2="6"/>
      <line x1="480" y1="-6" x2="640" y2="-6"/><line x1="480" y1="6" x2="640" y2="6"/>
      <line x1="820" y1="-6" x2="980" y2="-6"/><line x1="820" y1="6" x2="980" y2="6"/>
      <!-- Bottom wall windows -->
      <line x1="100" y1="474" x2="300" y2="474"/><line x1="100" y1="486" x2="300" y2="486"/>
      <line x1="800" y1="474" x2="1000" y2="474"/><line x1="800" y1="486" x2="1000" y2="486"/>
      <!-- Right wall windows -->
      <line x1="1074" y1="60" x2="1074" y2="160"/><line x1="1086" y1="60" x2="1086" y2="160"/>
      <line x1="1074" y1="260" x2="1074" y2="380"/><line x1="1086" y1="260" x2="1086" y2="380"/>
      <!-- Left wall windows -->
      <line x1="-6" y1="60" x2="-6" y2="160"/><line x1="6" y1="60" x2="6" y2="160"/>
      <line x1="-6" y1="380" x2="-6" y2="460"/><line x1="6" y1="380" x2="6" y2="460"/>
    </g>

    <!-- Window diagonal marks (indicating glass) -->
    <g stroke="#93c5fd" stroke-width="0.6" opacity="0.2">
      <line x1="140" y1="-6" x2="160" y2="6"/><line x1="180" y1="-6" x2="200" y2="6"/><line x1="220" y1="-6" x2="240" y2="6"/><line x1="260" y1="-6" x2="280" y2="6"/>
      <line x1="500" y1="-6" x2="520" y2="6"/><line x1="540" y1="-6" x2="560" y2="6"/><line x1="580" y1="-6" x2="600" y2="6"/><line x1="620" y1="-6" x2="640" y2="6"/>
      <line x1="840" y1="-6" x2="860" y2="6"/><line x1="880" y1="-6" x2="900" y2="6"/><line x1="920" y1="-6" x2="940" y2="6"/><line x1="960" y1="-6" x2="980" y2="6"/>
    </g>

    <!-- Crosshair markers at corners -->
    <g stroke="#60a5fa" stroke-width="0.8" opacity="0.25">
      <circle cx="0" cy="0" r="4" fill="none"/><line x1="-8" y1="0" x2="8" y2="0"/><line x1="0" y1="-8" x2="0" y2="8"/>
      <circle cx="1080" cy="0" r="4" fill="none"/><line x1="1072" y1="0" x2="1088" y2="0"/><line x1="1080" y1="-8" x2="1080" y2="8"/>
      <circle cx="0" cy="480" r="4" fill="none"/><line x1="-8" y1="480" x2="8" y2="480"/><line x1="0" y1="472" x2="0" y2="488"/>
      <circle cx="1080" cy="480" r="4" fill="none"/><line x1="1072" y1="480" x2="1088" y2="480"/><line x1="1080" y1="472" x2="1080" y2="488"/>
    </g>

    <!-- Room labels -->
    <g fill="#60a5fa" font-family="monospace" font-size="11" opacity="0.25">
      <text x="160" y="110">W-01</text>
      <text x="520" y="110">W-02</text>
      <text x="860" y="110">W-03</text>
      <text x="160" y="280">W-04</text>
      <text x="520" y="280">D-01</text>
      <text x="860" y="280">W-05</text>
      <text x="160" y="420">W-06</text>
      <text x="520" y="420">D-02</text>
      <text x="860" y="420">W-07</text>
    </g>

    <!-- Dimension lines — top -->
    <g stroke="#93c5fd" stroke-width="0.6" opacity="0.2">
      <line x1="0" y1="-30" x2="400" y2="-30"/>
      <line x1="0" y1="-35" x2="0" y2="-25"/>
      <line x1="400" y1="-35" x2="400" y2="-25"/>
      <line x1="400" y1="-30" x2="700" y2="-30"/>
      <line x1="700" y1="-35" x2="700" y2="-25"/>
      <line x1="700" y1="-30" x2="1080" y2="-30"/>
      <line x1="1080" y1="-35" x2="1080" y2="-25"/>
    </g>
    <g fill="#93c5fd" font-family="monospace" font-size="8" opacity="0.2">
      <text x="170" y="-35">4000</text>
      <text x="520" y="-35">3000</text>
      <text x="860" y="-35">3800</text>
    </g>

    <!-- Dimension lines — right side -->
    <g stroke="#93c5fd" stroke-width="0.6" opacity="0.2">
      <line x1="1110" y1="0" x2="1110" y2="200"/>
      <line x1="1105" y1="0" x2="1115" y2="0"/>
      <line x1="1105" y1="200" x2="1115" y2="200"/>
      <line x1="1110" y1="200" x2="1110" y2="480"/>
      <line x1="1105" y1="480" x2="1115" y2="480"/>
    </g>
    <g fill="#93c5fd" font-family="monospace" font-size="8" opacity="0.2" transform="rotate(90 1125 100)">
      <text x="1125" y="100">2000</text>
    </g>
    <g fill="#93c5fd" font-family="monospace" font-size="8" opacity="0.2" transform="rotate(90 1125 340)">
      <text x="1125" y="340">2800</text>
    </g>

    <!-- Dashed hidden lines (underground/hidden elements) -->
    <g stroke="#3b82f6" stroke-width="0.8" stroke-dasharray="8 6" opacity="0.12">
      <line x1="200" y1="200" x2="200" y2="480"/>
      <line x1="540" y1="0" x2="540" y2="200"/>
      <line x1="0" y1="420" x2="400" y2="420"/>
    </g>

    <!-- Title block (bottom right) -->
    <g transform="translate(830, 495)">
      <rect x="0" y="0" width="250" height="50" stroke="#60a5fa" stroke-width="1" fill="#0c1f3f" fill-opacity="0.8" opacity="0.3"/>
      <line x1="130" y1="0" x2="130" y2="50" stroke="#60a5fa" stroke-width="0.5" opacity="0.2"/>
      <line x1="0" y1="25" x2="130" y2="25" stroke="#60a5fa" stroke-width="0.5" opacity="0.2"/>
      <g fill="#60a5fa" font-family="monospace" font-size="7" opacity="0.25">
        <text x="8" y="14">VERREX INDUSTRIES</text>
        <text x="8" y="38">PROJECT: VX-2024</text>
        <text x="138" y="14">SCALE 1:100</text>
        <text x="138" y="28">REV. 03</text>
        <text x="138" y="42">SHEET 1/1</text>
      </g>
    </g>

    <!-- Compass rose (small) -->
    <g transform="translate(60, 450)" opacity="0.2">
      <circle cx="0" cy="0" r="16" stroke="#60a5fa" stroke-width="0.8" fill="none"/>
      <line x1="0" y1="-20" x2="0" y2="20" stroke="#60a5fa" stroke-width="0.6"/>
      <line x1="-20" y1="0" x2="20" y2="0" stroke="#60a5fa" stroke-width="0.6"/>
      <polygon points="0,-18 -3,-10 3,-10" fill="#60a5fa"/>
      <text x="-3" y="-22" fill="#60a5fa" font-family="monospace" font-size="8">N</text>
    </g>
  </g>
</svg>
