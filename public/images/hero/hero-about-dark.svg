<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 600" fill="none">
  <rect width="1920" height="600" fill="#0f172a"/>
  <defs>
    <linearGradient id="abg" x1="0" y1="0" x2="1920" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.4" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="aglow" x1="0" y1="200" x2="500" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="aglow2" x1="1920" y1="0" x2="1400" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="600" fill="url(#abg)"/>

  <!-- Radial glows -->
  <circle cx="150" cy="400" r="350" fill="url(#aglow)"/>
  <circle cx="1800" cy="100" r="400" fill="url(#aglow2)"/>

  <!-- Skyline silhouette far back -->
  <g fill="#1e293b" opacity="0.5">
    <rect x="100" y="420" width="80" height="180"/>
    <rect x="200" y="380" width="60" height="220"/>
    <rect x="280" y="440" width="100" height="160"/>
    <rect x="400" y="360" width="70" height="240"/>
    <rect x="490" y="400" width="90" height="200"/>
    <rect x="600" y="340" width="50" height="260"/>
    <rect x="670" y="410" width="110" height="190"/>
  </g>

  <!-- Modern glass building facade (right) -->
  <g transform="translate(1200, 60)" stroke="#3b82f6" fill="none" opacity="0.18">
    <!-- Outer frame -->
    <rect x="0" y="0" width="500" height="480" rx="4" stroke-width="2"/>
    <!-- Floors -->
    <line x1="0" y1="80" x2="500" y2="80" stroke-width="1.5"/>
    <line x1="0" y1="160" x2="500" y2="160" stroke-width="1.5"/>
    <line x1="0" y1="240" x2="500" y2="240" stroke-width="1.5"/>
    <line x1="0" y1="320" x2="500" y2="320" stroke-width="1.5"/>
    <line x1="0" y1="400" x2="500" y2="400" stroke-width="1.5"/>
    <!-- Columns -->
    <line x1="100" y1="0" x2="100" y2="480" stroke-width="1"/>
    <line x1="200" y1="0" x2="200" y2="480" stroke-width="1"/>
    <line x1="300" y1="0" x2="300" y2="480" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="480" stroke-width="1"/>
  </g>

  <!-- Glass panel fills (subtle) -->
  <g transform="translate(1200, 60)" fill="#3b82f6" opacity="0.04">
    <rect x="4" y="4" width="92" height="72" rx="1"/>
    <rect x="204" y="84" width="92" height="72" rx="1"/>
    <rect x="104" y="164" width="92" height="72" rx="1"/>
    <rect x="304" y="244" width="92" height="72" rx="1"/>
    <rect x="404" y="84" width="92" height="72" rx="1"/>
    <rect x="4" y="324" width="92" height="72" rx="1"/>
    <rect x="204" y="404" width="92" height="72" rx="1"/>
    <rect x="404" y="324" width="92" height="72" rx="1"/>
  </g>

  <!-- Building entrance detail -->
  <g transform="translate(1200, 60)" stroke="#60a5fa" fill="none" opacity="0.12">
    <rect x="180" y="410" width="140" height="70" rx="3" stroke-width="1.5"/>
    <line x1="250" y1="410" x2="250" y2="480" stroke-width="1"/>
    <rect x="190" y="416" width="52" height="58" rx="2"/>
    <rect x="258" y="416" width="52" height="58" rx="2"/>
  </g>

  <!-- Concentric arcs (warm, human feel — left side) -->
  <g stroke="#6366f1" fill="none" opacity="0.08" stroke-width="1">
    <circle cx="300" cy="300" r="120"/>
    <circle cx="300" cy="300" r="180"/>
    <circle cx="300" cy="300" r="240"/>
  </g>

  <!-- Abstract V mark -->
  <g stroke="#3b82f6" stroke-width="2" opacity="0.1" fill="none">
    <path d="M 850 120 L 960 350 L 1070 120"/>
    <path d="M 870 120 L 960 320 L 1050 120"/>
  </g>

  <!-- Decorative dots -->
  <g fill="#3b82f6" opacity="0.06">
    <circle cx="50" cy="80" r="2"/>
    <circle cx="150" cy="200" r="1.5"/>
    <circle cx="400" cy="150" r="2"/>
    <circle cx="600" cy="250" r="1.5"/>
    <circle cx="800" cy="100" r="2"/>
    <circle cx="1000" cy="500" r="1.5"/>
    <circle cx="1100" cy="350" r="2"/>
    <circle cx="1800" cy="500" r="2"/>
    <circle cx="1600" cy="550" r="1.5"/>
  </g>

  <!-- Subtle diagonal lines -->
  <g stroke="#334155" stroke-width="0.4" opacity="0.15">
    <line x1="0" y1="600" x2="400" y2="0"/>
    <line x1="100" y1="600" x2="500" y2="0"/>
    <line x1="1920" y1="600" x2="1520" y2="0"/>
  </g>
</svg>
