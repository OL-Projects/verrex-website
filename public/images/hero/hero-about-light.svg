<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 600" fill="none">
  <defs>
    <linearGradient id="bgL" x1="0" y1="0" x2="1920" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.5" stop-color="#f1f5f9"/>
      <stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
    <radialGradient id="glL1" cx="1400" cy="300" r="700" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.07"/>
      <stop offset="0.5" stop-color="#2563eb" stop-opacity="0.02"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glL2" cx="200" cy="300" r="500" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hexFadeL" x1="400" y1="0" x2="1920" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#3b82f6" stop-opacity="0.08"/>
      <stop offset="0.6" stop-color="#3b82f6" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="hexFillL" x1="400" y1="0" x2="1920" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#3b82f6" stop-opacity="0.01"/>
      <stop offset="0.7" stop-color="#3b82f6" stop-opacity="0.025"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0.04"/>
    </linearGradient>
    <pattern id="hexL" width="69.28" height="120" patternUnits="userSpaceOnUse">
      <polygon points="34.64,0 69.28,20 69.28,60 34.64,80 0,60 0,20" stroke="url(#hexFadeL)" stroke-width="1" fill="url(#hexFillL)"/>
      <polygon points="0,60 34.64,80 34.64,120 0,140 -34.64,120 -34.64,80" stroke="url(#hexFadeL)" stroke-width="1" fill="url(#hexFillL)"/>
      <polygon points="69.28,60 103.92,80 103.92,120 69.28,140 34.64,120 34.64,80" stroke="url(#hexFadeL)" stroke-width="1" fill="url(#hexFillL)"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1920" height="600" fill="url(#bgL)"/>
  <rect width="1920" height="600" fill="url(#glL1)"/>
  <rect width="1920" height="600" fill="url(#glL2)"/>

  <!-- Full honeycomb pattern layer -->
  <rect x="300" y="-20" width="1640" height="640" fill="url(#hexL)"/>

  <!-- Fade overlay left side -->
  <rect x="0" y="0" width="700" height="600" fill="url(#bgL)" opacity="0.85"/>

  <!-- "Lit" hexagon cells -->
  <g fill="#3b82f6" opacity="0.06">
    <polygon points="934.64,200 969.28,220 969.28,260 934.64,280 900,260 900,220" />
    <polygon points="1142.56,80 1177.2,100 1177.2,140 1142.56,160 1107.92,140 1107.92,100" />
    <polygon points="1350.48,320 1385.12,340 1385.12,380 1350.48,400 1315.84,380 1315.84,340" />
    <polygon points="1558.4,140 1593.04,160 1593.04,200 1558.4,220 1523.76,200 1523.76,160" />
    <polygon points="1696.96,380 1731.6,400 1731.6,440 1696.96,460 1662.32,440 1662.32,400" />
    <polygon points="1073.28,440 1107.92,460 1107.92,500 1073.28,520 1038.64,500 1038.64,460" />
    <polygon points="1489.12,500 1523.76,520 1523.76,560 1489.12,580 1454.48,560 1454.48,520" />
    <polygon points="1835.6,260 1870.24,280 1870.24,320 1835.6,340 1800.96,320 1800.96,280" />
  </g>

  <!-- Accent cells -->
  <g fill="#60a5fa" opacity="0.05">
    <polygon points="1211.84,260 1246.48,280 1246.48,320 1211.84,340 1177.2,320 1177.2,280" />
    <polygon points="1627.68,20 1662.32,40 1662.32,80 1627.68,100 1593.04,80 1593.04,40" />
    <polygon points="1766.32,500 1800.96,520 1800.96,560 1766.32,580 1731.68,560 1731.68,520" />
  </g>

  <!-- Subtle glow behind hex clusters -->
  <circle cx="1350" cy="300" r="200" fill="#3b82f6" opacity="0.02"/>
  <circle cx="1650" cy="200" r="150" fill="#6366f1" opacity="0.015"/>
  <circle cx="1100" cy="450" r="180" fill="#3b82f6" opacity="0.015"/>
</svg>
